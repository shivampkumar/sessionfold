[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "sessionfold"
version = "0.1.0a5"
description = "Free disk space by storing repeated screenshots in Codex histories only once"
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
authors = [{name = "Shivam Kumar"}]
keywords = ["codex", "agents", "sessions", "deduplication"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Operating System :: MacOS",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Topic :: System :: Archiving",
]

[project.urls]
Homepage = "https://github.com/shivampkumar/sessionfold"
Repository = "https://github.com/shivampkumar/sessionfold"
Issues = "https://github.com/shivampkumar/sessionfold/issues"
Changelog = "https://github.com/shivampkumar/sessionfold/blob/main/CHANGELOG.md"

[project.scripts]
sessionfold = "sessionfold.cli:main"

[tool.setuptools.packages.find]
include = ["sessionfold*"]

[tool.ruff]
target-version = "py310"
