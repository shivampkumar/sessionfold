[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-coldstore"
version = "0.1.0"
description = "Lossless content-addressed cold storage for AI agent session histories"
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
authors = [{name = "Agent Coldstore contributors"}]
keywords = ["codex", "claude-code", "agents", "sessions", "deduplication"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Operating System :: MacOS",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Topic :: System :: Archiving",
]

[project.scripts]
agent-coldstore = "agent_coldstore.cli:main"

[tool.setuptools.packages.find]
include = ["agent_coldstore*"]

[tool.ruff]
target-version = "py310"
